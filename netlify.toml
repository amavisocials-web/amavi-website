# Netlify build configuration.
#
# Both forms send to an Apps Script web app, whose URL is the
# PUBLIC_SHEETS_ENDPOINT environment variable (set it in the Netlify UI — see
# README): creator applications from /creator-network become a row in a
# Google Sheet and an email, brand enquiries from /contact an email. Netlify
# Forms keeps a copy of every one. Netlify only registers the forms
# (brand-enquiry, creator-application, journal-subscribe) once form detection
# is enabled for the project, under Forms in the Netlify UI, and the site has
# been deployed again after that. Until then every submission to them is
# answered 404.
# The /creators, /become-a-creator, /services and /journal redirects are
# defined in astro.config.mjs, not here, so each destination URL is only ever
# written down once.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local toolchain (.nvmrc) so builds are reproducible.
  NODE_VERSION = "22"

# Static assets are content-hashed by Astro, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
