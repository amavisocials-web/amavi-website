# Netlify build configuration.
#
# The site has no forms: brands are sent to email and creators to the
# existing application form (see src/consts.ts). Netlify Forms is unused.
# The /creators redirect is defined in astro.config.mjs, not here, so the
# destination URL is only ever written down once.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local toolchain (.nvmrc) so builds are reproducible.
  NODE_VERSION = "22"

# Static assets are content-hashed by Astro, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
