# Netlify build configuration.
#
# Brands are sent to email. Creators apply at /become-a-creator: each
# application goes to a Google Sheet through an Apps Script web app, whose URL
# is the PUBLIC_SHEETS_ENDPOINT environment variable (set it in the Netlify UI
# — see README), and Netlify Forms keeps a backup copy of every one. The form
# is detected automatically at deploy time.
# The /creators and /services redirects are defined in astro.config.mjs, not
# here, so each destination URL is only ever written down once.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local toolchain (.nvmrc) so builds are reproducible.
  NODE_VERSION = "22"

# Static assets are content-hashed by Astro, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
